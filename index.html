<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會議室預約系統 - 行事曆版</title>
    
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; line-height: 1.6; max-width: 1000px; margin: 20px auto; padding: 15px; background-color: #f4f7f6; }
        .container { display: flex; flex-wrap: wrap; gap: 20px; }
        .sidebar { flex: 1; min-width: 300px; }
        .main-content { flex: 2; min-width: 500px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .card { background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        label { display: block; margin-top: 10px; font-weight: bold; color: #555; }
        input, select, button { width: 100%; padding: 12px; margin-top: 5px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        button { background-color: #4285f4; color: white; border: none; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { background-color: #357ae8; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        
        /* 管理員清理舊資料按鈕樣式 */
        .cleanup-btn { background-color: #ff9800; width: auto; font-size: 14px; padding: 8px 15px; display: inline-block; margin-bottom: 10px; }
        .cleanup-btn:hover { background-color: #e68a00; }

        #calendar { margin-top: 10px; }
        .minguo-title { font-size: 16px; color: #e67e22; font-weight: bold; margin-bottom: 10px; text-align: center; }
        .fc-event { cursor: pointer; padding: 2px 5px; }
        .calendar-header-actions { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        /* ✨ 核心修正：強制日曆文字換行 */
        .fc-event, .fc-event-main {
            white-space: normal !important;
            flex-direction: column !important;
            display: flex !important;
        }
        
        .fc-event-title {
            white-space: pre-line !important; /* 💡 pre-line 能完美解析 \n 換行 */
            word-break: break-all !important;
            font-size: 14px !important;       /* 稍微放大字體 */
            line-height: 1.5 !important;
            padding: 2px 0 !important;
        }

        /* 讓日曆格子長高，換行後預約多的時候才不會擠爆 */
        .fc .fc-daygrid-day-frame {
            min-height: 110px !important; 
        }
        /* .fc-event-title {
            white-space: normal !important;
            word-break: break-all !important;
        }
        .fc-event-main {
            line-height: 1.4 !important;
            padding: 2px 0;
        } */
    </style>
</head>
<body>

    <h2>📅 會議室預約系統 (行事曆版)</h2>
    
    <div class="container">
        <div class="sidebar">
            <div class="card">
                <button id="loginBtn" onclick="login()">🔑 使用 Google 帳號登入</button>
                <p id="userInfo" style="margin-top:10px; color: #28a745; font-weight:bold; display:none;"></p>
            </div>

            <div class="card">
                <h3>➕ 新增預約</h3>
                
                <label>會議名稱</label>
                <input id="title" type="text" placeholder="輸入會議主題">

                <label>科室名稱</label>
                <input id="dept" type="text" placeholder="例如：行政科">

                <label>預約者姓名</label>
                <input id="userName" type="text" placeholder="請輸入姓名">

                <label>選擇會議室</label>
                <select id="room">
                    <option value="">載入中...</option>
                </select>

                <label>開始時間</label>
                <input id="start" type="datetime-local">

                <label>結束時間</label>
                <input id="end" type="datetime-local">

                <button id="addBtn" onclick="addMeeting()">確認預約</button>
            </div>
        </div>

        <div class="main-content">
            <div class="calendar-header-actions">
                <div id="minguoDisplay" class="minguo-title">請先登入以查看預約行事曆</div>
                <button id="cleanupBtn" class="cleanup-btn" onclick="autoCleanup()" style="display:none;">🧹 清理一個月前舊資料</button>
            </div>
            <div id="calendar"></div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { 
        getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy, runTransaction 
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { 
        getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, setPersistence, browserSessionPersistence
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDQDfsnKG6nuUu8q1pw15ZQnPs_vvJa0ls",
        authDomain: "meeting-system-ee93f.firebaseapp.com",
        projectId: "meeting-system-ee93f",
        storageBucket: "meeting-system-ee93f.firebasestorage.app",
        messagingSenderId: "875441850233",
        appId: "1:875441850233:web:318995771425a5a24f91a8",
        measurementId: "G-2QZ25EXVDZ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    
    // 管理員清單配置
    const ADMIN_EMAILS = ["m700912@gmail.com"];
    let currentUser = null;
    let calendar = null;

    const roomColors = {
        "A會議室": "#4285f4",
        "B會議室": "#34a853",
        "簡報室": "#fbbc05",
        "預設": "#9c27b0"
    };

    // 初始化 FullCalendar
    function initCalendar() {
        const calendarEl = document.getElementById('calendar');
        calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            locale: 'zh-tw',
            displayEventTime: false, // 隱藏日曆內建的時間標籤
            navLinks: true, 
            
            eventTimeFormat: {
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            },

            eventDidMount: function(info) {
                info.el.style.whiteSpace = 'normal'; // 允許換行，確保長字完整呈現
                info.el.style.contentVisibility = 'auto';
            },
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,timeGridWeek,timeGridDay'
            },
            buttonText: { today: '今天', month: '月', week: '週', day: '日' },
            datesSet: function(info) {
                updateMinguoTitle(info.view.title);
            },
            eventClick: function(info) {
                const props = info.event.extendedProps;
                
                // 時間格式轉換函式 (月/日 時:分)
                const toMinguoMsg = (dateStr) => {
                    if (!dateStr) return "未設定";
                    const d = new Date(dateStr);
                    const mm = d.getMonth() + 1;                  
                    const dd = d.getDate();                       
                    const hh = String(d.getHours()).padStart(2, '0');  
                    const min = String(d.getMinutes()).padStart(2, '0');
                    return `${mm}/${dd} ${hh}:${min}`;
                };

                // 💡 先抓取第一行，並自動把開頭的「📝 」圖示與空格濾掉，保留乾淨的會議名稱
                const firstLine = info.event.title.split('\n')[0].trim();
                const cleanTitle = firstLine.replace(/^📝\s*/, '');

                let msg = `會議：${cleanTitle}\n`;
                msg += `會議室：${props.room}\n`;
                msg += `科室：${props.dept || "未填"}\n`;
                msg += `預約者：${props.userName || "未填"}\n`;
                msg += `開始時間：${toMinguoMsg(props.startTime)}\n`;
                msg += `結束時間：${toMinguoMsg(props.endTime)}`;
                
                // 🔒 嚴格的一視同仁檢查：只認是不是建立者本人
                const isOwner = currentUser && props.userEmail === currentUser.email;
                if (isOwner) {
                    if (confirm(`${msg}\n\n[您是此預約建立者] 確定要刪除此預約嗎？`)) {
                        delMeeting(info.event.id);
                    }
                } else {
                    // 🔒 非本人點擊一律唯讀
                    alert(`${msg}\n\n🔒 唯讀模式：您不是此會議的預約者，無法刪除他人的會議。`);
                }
            }
        });
        calendar.render();
    }

    function updateMinguoTitle(viewTitle) {
        const yearMatch = viewTitle.match(/\d{4}/);
        if (yearMatch) {
            const currentYear = parseInt(yearMatch[0]);
            const minguoYear = currentYear - 1911;
            document.getElementById("minguoDisplay").innerText = `💡 目前檢視：民國 ${minguoYear} 年 (${viewTitle})`;
        } else {
            document.getElementById("minguoDisplay").innerText = `💡 目前檢視：${viewTitle}`;
        }
    }

    // 監聽登入狀態
    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUser = user;
            document.getElementById("userInfo").innerText = "✅已使用Google帳號登入";
            document.getElementById("userInfo").style.display = "block";
            document.getElementById("loginBtn").style.display = "none";
            
            // 如果是管理員，自動秀出「清理一個月前舊資料」按鈕
            if (ADMIN_EMAILS.includes(user.email)) {
                document.getElementById("cleanupBtn").style.display = "inline-block";
            }

            initCalendar(); 
            loadRooms();
            loadData();
        } else {
            document.getElementById("calendar").innerHTML = "";
            document.getElementById("minguoDisplay").innerText = "請先登入以查看預約行事曆";
            document.getElementById("cleanupBtn").style.display = "none";
        }
    });

    // 登入功能
    window.login = async function () {
        try {
            await setPersistence(auth, browserSessionPersistence);
            await signInWithPopup(auth, provider);
        } catch (e) {
            if (e.code === "auth/popup-blocked") {
                alert("❌ 登入視窗被瀏覽器攔截，請允許彈出視窗。");
            } else {
                alert("登入失敗：" + e.message);
            }
        }
    };

    // 載入會議室清單並預選 A 會議室
    async function loadRooms() {
        const snapshot = await getDocs(collection(db, "rooms"));
        const select = document.getElementById("room");
        select.innerHTML = ""; 
        snapshot.forEach((d) => {
            const roomName = d.data().name;
            const opt = document.createElement("option");
            opt.value = roomName;
            opt.textContent = roomName;
            if (roomName === "A會議室") opt.selected = true; 
            select.appendChild(opt);
        });
    }

    /* ➕ 新增預約 */
    window.addMeeting = async function () {
        if (!currentUser) return alert("請先登入");

        const title = document.getElementById("title").value;
        const dept = document.getElementById("dept").value;
        const userName = document.getElementById("userName").value;
        const room = document.getElementById("room").value;
        const startVal = document.getElementById("start").value;
        const endVal = document.getElementById("end").value;
        const addBtn = document.getElementById("addBtn");

        if (!title || !dept || !userName || !room || !startVal || !endVal) return alert("請填寫所有欄位");

        const newStart = new Date(startVal);
        const newEnd = new Date(endVal);
        if (newStart >= newEnd) return alert("❌ 結束時間必須晚於開始時間");

        addBtn.disabled = true;
        addBtn.textContent = "⌛ 正在同步核對預約...";

        try {
            await runTransaction(db, async (transaction) => {
                const snapshot = await getDocs(collection(db, "meetings"));
                let isConflict = false;

                snapshot.forEach((d) => {
                    const m = d.data();
                    if (m.room === room) {
                        const existS = new Date(m.startTime);
                        const existE = new Date(m.endTime);
                        if (newStart < existE && newEnd > existS) isConflict = true;
                    }
                });

                if (isConflict) throw "CONFLICT";

                const newDocRef = doc(collection(db, "meetings"));
                transaction.set(newDocRef, {
                    title, dept, userName, room,
                    startTime: startVal,
                    endTime: endVal,
                    userEmail: currentUser.email,
                    createdAt: new Date().toISOString()
                });
            });

            alert("✅ 預約成功！");
            document.getElementById("title").value = "";
            loadData();
        } catch (e) {
            if (e === "CONFLICT") alert("❌ 該時段已被預約！");
            else alert("錯誤：" + e);
        } finally {
            addBtn.disabled = false;
            addBtn.textContent = "確認預約";
        }
    };

    // 刪除會議功能
    async function delMeeting(id) {
        await deleteDoc(doc(db, "meetings", id));
        loadData();
    }

    /* 🧹 管理員一鍵清理一個月前舊資料 */
    window.autoCleanup = async function () {
        if (!currentUser || !ADMIN_EMAILS.includes(currentUser.email)) {
            return alert("🔒 只有管理員可以使用此功能。");
        }

        if (confirm("確定要刪除所有「一個月前」的歷史會議預約資料嗎？此操作無法還原。")) {
            try {
                const snapshot = await getDocs(collection(db, "meetings"));
                const oneMonthAgo = new Date();
                oneMonthAgo.setMonth(oneMonthAgo.getMonth() - 1); 
                
                let deleteCount = 0;

                for (const d of snapshot.docs) {
                    const m = d.data();
                    const meetingEndTime = new Date(m.endTime);
                    
                    if (meetingEndTime < oneMonthAgo) {
                        await deleteDoc(doc(db, "meetings", d.id));
                        deleteCount++;
                    }
                }

                alert(`🧹 清理完成！共刪除了 ${deleteCount} 筆舊資料。`);
                loadData(); 
            } catch (e) {
                alert("清理失敗：" + e);
            }
        }
    };

    /* 📋 載入資料並放入行事曆 */
    async function loadData() {
        if (!calendar) return;
        
        try {
            const snapshot = await getDocs(collection(db, "meetings"));
            const events = [];

            snapshot.forEach((d) => {
                const m = d.data();
                const eventColor = roomColors[m.room] || roomColors["預設"];

                events.push({
                    id: d.id,
                    // 💡 加上精緻小圖示後的換行格式
                    title: `📝 ${m.title}\n 📍 [${m.room}]\n 👤 ${m.userName || '未填'}`,
                    start: m.startTime,
                    end: m.endTime,
                    backgroundColor: eventColor,
                    borderColor: eventColor,
                    extendedProps: {
                        room: m.room,
                        dept: m.dept,
                        userName: m.userName,
                        userEmail: m.userEmail,
                        startTime: m.startTime, 
                        endTime: m.endTime
                    }
                });
            });

            calendar.removeAllEvents();
            calendar.addEventSource(events);
            
        } catch (e) { 
            console.error("載入日曆資料失敗：", e); 
        }
    }
</script>
</body>
</html>
