<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會議室預約系統 - 行事曆版</title>
    
    <!-- 引入 FullCalendar 樣式與主程式 -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; line-height: 1.6; max-width: 1000px; margin: 20px auto; padding: 15px; background-color: #f4f7f6; }
        .container { display: flex; flex-wrap: wrap; gap: 20px; }
        .sidebar { flex: 1; min-width: 300px; }
        .main-content { flex: 2; min-width: 500px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .card { background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        label { display: block; margin-top: 10px; font-weight: bold; color: #555; }
        input, select, button { width: 100%; padding: 12px; margin-top: 5px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        button { background-color: #4285f4; color: white; border: none; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { background-color: #357ae8; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        
        /* 日曆自訂樣式調整 */
        #calendar { margin-top: 10px; }
        .minguo-title { font-size: 16px; color: #e67e22; font-weight: bold; margin-bottom: 10px; text-align: center; }
        .fc-event { cursor: pointer; padding: 2px 5px; }
    </style>
</head>
<body>

    <h2>📅 會議室預約系統 (行事曆版)</h2>
    
    <div class="container">
        <!-- 左側：登入與操作面板 -->
        <div class="sidebar">
            <div class="card">
                <button id="loginBtn" onclick="login()">🔑 使用 Google 帳號登入</button>
                <p id="userInfo" style="margin-top:10px; color: #28a745; font-weight:bold; display:none;"></p>
            </div>

            <div class="card">
                <h3>➕ 新增預約</h3>
                
                <label>會議名稱</label>
                <input id="title" type="text" placeholder="輸入會議主題">

                <label>科室名稱</label>
                <input id="dept" type="text" placeholder="例如：行政科">

                <label>預約者姓名</label>
                <input id="userName" type="text" placeholder="請輸入姓名">

                <label>選擇會議室</label>
                <select id="room">
                    <option value="">載入中...</option>
                </select>

                <label>開始時間</label>
                <input id="start" type="datetime-local">

                <label>結束時間</label>
                <input id="end" type="datetime-local">

                <button id="addBtn" onclick="addMeeting()">確認預約</button>
            </div>
        </div>

        <!-- 右側：行事曆主體 -->
        <div class="main-content">
            <div id="minguoDisplay" class="minguo-title">請先登入以查看預約行事曆</div>
            <div id="calendar"></div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { 
        getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy, runTransaction 
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { 
        getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, setPersistence, browserSessionPersistence
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDQDfsnKG6nuUu8q1pw15ZQnPs_vvJa0ls",
        authDomain: "meeting-system-ee93f.firebaseapp.com",
        projectId: "meeting-system-ee93f",
        storageBucket: "meeting-system-ee93f.firebasestorage.app",
        messagingSenderId: "875441850233",
        appId: "1:875441850233:web:318995771425a5a24f91a8",
        measurementId: "G-2QZ25EXVDZ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    let currentUser = null;
    let calendar = null;

    // 會議室顏色對照表（可自行擴充）
    const roomColors = {
        "A會議室": "#4285f4",
        "B會議室": "#34a853",
        "簡報室": "#fbbc05",
        "預設": "#9c27b0"
    };

    // 初始化 FullCalendar
    function initCalendar() {
        const calendarEl = document.getElementById('calendar');
        calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            locale: 'zh-tw',
            navLinks: true, 
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,timeGridWeek,timeGridDay'
            },
            buttonText: {
                today: '今天',
                month: '月',
                week: '週',
                day: '日'
            },
            // 監聽日曆切換事件，用來即時更新畫面上方「民國年」的標題
            datesSet: function(info) {
                updateMinguoTitle(info.view.title);
            },
            // 點擊行程時觸發彈窗（提供刪除功能）
            eventClick: function(info) {
                const props = info.event.extendedProps;
                let msg = `會議：${info.event.title}\n會議室：${props.room}\n科室：${props.dept}\n預約者：${props.userName}`;
                
                if (currentUser && props.userEmail === currentUser.email) {
                    if (confirm(`${msg}\n\n[您是此預約建立者] 確定要刪除此預約嗎？`)) {
                        delMeeting(info.event.id);
                    }
                } else {
                    alert(msg);
                }
            }
        });
        calendar.render();
    }

    // 將日曆標題轉換成民國年文字
    function updateMinguoTitle(viewTitle) {
        // 匹配四碼西元年份，例如 "2026年5月"
        const yearMatch = viewTitle.match(/\d{4}/);
        if (yearMatch) {
            const currentYear = parseInt(yearMatch[0]);
            const minguoYear = currentYear - 1911;
            document.getElementById("minguoDisplay").innerText = `💡 目前檢視：民國 ${minguoYear} 年 (${viewTitle})`;
        } else {
            document.getElementById("minguoDisplay").innerText = `💡 目前檢視：${viewTitle}`;
        }
    }

    // 監聽登入狀態
    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUser = user;
            document.getElementById("userInfo").innerText = "✅已使用Google帳號登入";
            document.getElementById("userInfo").style.display = "block";
            document.getElementById("loginBtn").style.display = "none";
            
            initCalendar(); // 登入後初始化日曆
            loadRooms();
            loadData();
        } else {
            document.getElementById("calendar").innerHTML = "";
            document.getElementById("minguoDisplay").innerText = "請先登入以查看預約行事曆";
        }
    });

    // 登入功能
    window.login = async function () {
        try {
            await setPersistence(auth, browserSessionPersistence);
            await signInWithPopup(auth, provider);
        } catch (e) {
            if (e.code === "auth/popup-blocked") {
                alert("❌ 登入視窗被瀏覽器攔截，請允許彈出視窗。");
            } else {
                alert("登入失敗：" + e.message);
            }
        }
    };

    // 載入會議室清單
    async function loadRooms() {
        const snapshot = await getDocs(collection(db, "rooms"));
        const select = document.getElementById("room");
        select.innerHTML = "<option value=''>請選擇會議室</option>";
        snapshot.forEach((d) => {
            const opt = document.createElement("option");
            opt.value = d.data().name;
            opt.textContent = d.data().name;
            select.appendChild(opt);
        });
    }

    /* ➕ 新增預約 */
    window.addMeeting = async function () {
        if (!currentUser) return alert("請先登入");

        const title = document.getElementById("title").value;
        const dept = document.getElementById("dept").value;
        const userName = document.getElementById("userName").value;
        const room = document.getElementById("room").value;
        const startVal = document.getElementById("start").value;
        const endVal = document.getElementById("end").value;
        const addBtn = document.getElementById("addBtn");

        if (!title || !dept || !userName || !room || !startVal || !endVal) return alert("請填寫所有欄位");

        const newStart = new Date(startVal);
        const newEnd = new Date(endVal);
        if (newStart >= newEnd) return alert("❌ 結束時間必須晚於開始時間");

        addBtn.disabled = true;
        addBtn.textContent = "⌛ 正在同步核對預約...";

        try {
            await runTransaction(db, async (transaction) => {
                const snapshot = await getDocs(collection(db, "meetings"));
                let isConflict = false;

                snapshot.forEach((d) => {
                    const m = d.data();
                    if (m.room === room) {
                        const existS = new Date(m.startTime);
                        const existE = new Date(m.endTime);
                        if (newStart < existE && newEnd > existS) isConflict = true;
                    }
                });

                if (isConflict) throw "CONFLICT";

                const newDocRef = doc(collection(db, "meetings"));
                transaction.set(newDocRef, {
                    title, dept, userName, room,
                    startTime: startVal,
                    endTime: endVal,
                    userEmail: currentUser.email,
                    createdAt: new Date().toISOString()
                });
            });

            alert("✅ 預約成功！");
            document.getElementById("title").value = "";
            loadData();
        } catch (e) {
            if (e === "CONFLICT") alert("❌ 該時段已被預約！");
            else alert("錯誤：" + e);
        } finally {
            addBtn.disabled = false;
            addBtn.textContent = "確認預約";
        }
    };

    // 刪除會議功能
    async function delMeeting(id) {
        await deleteDoc(doc(db, "meetings", id));
        loadData();
    }

    /* 📋 載入資料並放入行事曆 */
    async function loadData() {
        if (!calendar) return;
        
        try {
            const snapshot = await getDocs(collection(db, "meetings"));
            const events = [];

            snapshot.forEach((d) => {
                const m = d.data();
                
                // 根據會議室名稱給予不同顏色
                const eventColor = roomColors[m.room] || roomColors["預設"];

                events.push({
                    id: d.id,
                    title: `[${m.room}] ${m.title}`,
                    start: m.startTime,
                    end: m.endTime,
                    backgroundColor: eventColor,
                    borderColor: eventColor,
                    extendedProps: {
                        room: m.room,
                        dept: m.dept,
                        userName: m.userName,
                        userEmail: m.userEmail
                    }
                });
            });

            // 清除現有事件並重新載入新事件
            calendar.removeAllEvents();
            calendar.addEventSource(events);
            
        } catch (e) { 
            console.error("載入日曆資料失敗：", e); 
        }
    }
</script>
</body>
</html>
