<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>會議室系統</title>
</head>

<body>

<h2>📅 會議室系統</h2>

<button onclick="login()">Google登入</button>

<hr>

<h3>新增會議</h3>

<input id="title" placeholder="會議名稱">

<select id="room"></select>

<br><br>

開始：
<input id="start" type="datetime-local">

<br><br>

結束：
<input id="end" type="datetime-local">

<br><br>

<button onclick="addMeeting()">新增</button>

<hr>

<h3>📅 會議列表</h3>
<ul id="list"></ul>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  deleteDoc,
  doc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

/* Firebase Config（你已經填好了） */
const firebaseConfig = {
  apiKey: "AIzaSyDQDfsnKG6nuUu8q1pw15ZQnPs_vvJa0ls",
  authDomain: "meeting-system-ee93f.firebaseapp.com",
  projectId: "meeting-system-ee93f",
  storageBucket: "meeting-system-ee93f.firebasestorage.app",
  messagingSenderId: "875441850233",
  appId: "1:875441850233:web:318995771425a5a24f91a8",
  measurementId: "G-2QZ25EXVDZ"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

let currentUser = null;

/* 🔐 Google登入 */
window.login = async function () {
  const result = await signInWithPopup(auth, provider);
  currentUser = result.user;
  alert("登入成功：" + currentUser.email);
};

/* 🏢 載入會議室 */
async function loadRooms() {

  const snapshot = await getDocs(collection(db, "rooms"));
  const select = document.getElementById("room");

  select.innerHTML = "<option value=''>請選擇會議室</option>";

  snapshot.forEach((d) => {
    const data = d.data();

    const opt = document.createElement("option");
    opt.value = data.name;
    opt.textContent = data.name;

    select.appendChild(opt);
  });
}

/* ➕ 新增會議 */
window.addMeeting = async function () {
  if (!currentUser) {
    alert("請先登入");
    return;
  }

  const title = document.getElementById("title").value;
  const room = document.getElementById("room").value;
  const startInput = document.getElementById("start").value;
  const endInput = document.getElementById("end").value;

  /* 1. 基本防呆 */
  if (!title || !room || !startInput || !endInput) {
    alert("請填寫完整資料");
    return;
  }

  const newStart = new Date(startInput);
  const newEnd = new Date(endInput);

  if (newStart >= newEnd) {
    alert("❌ 結束時間必須晚於開始時間");
    return;
  }

  /* 2. 檢查衝突 (核心邏輯) */
  const snapshot = await getDocs(collection(db, "meetings"));
  let isConflict = false;

  snapshot.forEach((d) => {
    const m = d.data();
    
    // 只比較「同一個會議室」的預約
    if (m.room === room) {
      const existStart = new Date(m.startTime);
      const existEnd = new Date(m.endTime);

      // 檢查時間是否重疊
      if (newStart < existEnd && newEnd > existStart) {
        isConflict = true;
      }
    }
  });

  if (isConflict) {
    alert("❌ 該時段會議室已被預約，請選擇其他時間或會議室");
    return;
  }

  /* 3. 無衝突，寫入資料庫 */
  await addDoc(collection(db, "meetings"), {
    title: title,
    room: room,
    startTime: startInput,  // 存入字串 "2026-05-15T14:30"
    endTime: endInput,
    userEmail: currentUser.email,
    createdAt: new Date().toISOString()
  });

  alert("✅ 預約成功！");
  loadData();
};

/* 🗑️ 刪除 */
window.del = async function (id) {
  await deleteDoc(doc(db, "meetings", id));
  loadData();
};

/* 📋 顯示列表（正式穩定版） */
async function loadData() {

  const snapshot = await getDocs(collection(db, "meetings"));
  const list = document.getElementById("list");

  list.innerHTML = "";

  snapshot.forEach((d) => {

    const m = d.data();

    const title = m.title || "無標題";
    const room = m.room || "無房間";

    let startText = "無時間";
    let endText = "";

    if (m.startTime) {
      startText = new Date(m.startTime).toLocaleString();
    }

    if (m.endTime) {
      endText = " ~ " + new Date(m.endTime).toLocaleString();
    }

    list.innerHTML += `
      <li>
        ${title}
        ｜${room}
        ｜${startText}${endText}
        <button onclick="del('${d.id}')">刪除</button>
      </li>
    `;
  });
}

/* 🚀 初始化 */
window.onload = async function () {
  await loadRooms();
  await loadData();
};

</script>

</body>
</html>
